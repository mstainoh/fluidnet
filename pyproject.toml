[project]
name = "fluidnet"
version = "0.2.0.dev0"
description = "Graph-first steady-state fluid network simulation with polymorphic rates and pluggable loss functions."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Marcelo Stainoh", email = "mstainoh@gmail.com" }]
license = { text = "MIT" }
keywords = ["fluid-networks", "hydraulics", "pipe-flow", "networkx", "simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11",
  "networkx>=3.0",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov",
  "ruff",
  "mypy",
  "fluids>=1.3",
  "import-linter",
]

[project.urls]
Repository = "https://github.com/mstainoh/fluidnet"
Issues = "https://github.com/mstainoh/fluidnet/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
fluidnet = ["py.typed"]
"fluidnet.physics" = ["data/*.yaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
strict = true
packages = ["fluidnet"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[tool.importlinter]
root_package = "fluidnet"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dependencias de capa en un solo sentido"
type = "layers"
containers = ["fluidnet"]
layers = [
    "(solvers)",
    "(network) : (losses)",
    "(rate)",
    "state : physics",
    "_types",
]

[[tool.importlinter.contracts]]
name = "physics y state son hermanos de capa cero"
type = "independence"
modules = ["fluidnet.physics", "fluidnet.state"]

[[tool.importlinter.contracts]]
name = "La capa cero no conoce la red ni la I/O"
type = "forbidden"
source_modules = ["fluidnet.physics", "fluidnet.state"]
forbidden_modules = ["networkx", "pandas"]