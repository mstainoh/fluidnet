name: checks

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (dev)
        run: pip install -e ".[dev]"

      - name: Verify cross-validation oracle is present
        run: python -c "import fluids"

      - name: pre-commit (ruff + import-linter contracts)
        run: pre-commit run --all-files

      - name: mypy
        run: python -m mypy

      - name: pytest
        run: pytest --cov=fluidnet --cov-report=term-missing
